name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable, so `release.yml` can depend on it. Re-implementing these checks as
  # steps inside the release is what let a sibling project tag v0.4.1 while its own
  # validate run for that tag was red — npm served it four minutes later. A release
  # that cannot be stopped by a red suite is not gated by one.
  workflow_call:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor the manifests promise; 22 is what most operators run.
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: suite
        run: npm test
      - name: every guard, watched failing
        # A green suite proves the code passes the tests. This proves the tests would
        # notice if it stopped.
        run: node scripts/negative-self-test.js

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: every manifest is valid JSON
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            found=$((found + 1))
          done < <(find . -name '*.json' -not -path './node_modules/*' -not -path './.git/*')
          echo "parsed $found manifest(s)"
          test "$found" -ge 7

  plugin-validate:
    runs-on: ubuntu-latest
    # Anthropic's own gate, as its own job. The `manifests` job above only proves the
    # JSON parses; it says nothing about whether Claude Code would load these plugins.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: claude plugin validate --strict, on both plugins and the marketplace
        run: |
          set -eu
          npm install -g @anthropic-ai/claude-code
          claude --version
          claude plugin validate ./plugins/prowl --strict
          claude plugin validate ./plugins/prowl-cli --strict
          claude plugin validate . --strict

  tool-count:
    runs-on: ubuntu-latest
    # Reaches prowl.chat. Kept out of `npm test`, which must work offline, and kept
    # non-blocking on forks, where a network egress failure says nothing about the
    # change under test.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: the stated tool count still matches the server
        run: npm run check:tools

  contract:
    runs-on: ubuntu-latest
    # Names, not just the count. Needs a key: tools/list answers -32001 without one,
    # so on a fork — where the secret is absent — the script reports UNKNOWN and exits
    # 0 rather than pretending the pages were checked.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: the pages name only tools the server registers
        env:
          PROWL_API_KEY: ${{ secrets.PROWL_API_KEY }}
        run: npm run check:contract

  cli:
    runs-on: ubuntu-latest
    # Reads the published tarball of the package the prowl-cli page describes. Needs no
    # secret — npm is public — but still non-blocking: a registry outage says nothing
    # about the change under test.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: the page describes the CLI npm actually serves
        run: npm run check:cli
